services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sales_dashboard;Username=postgres;Password=postgres"
      Dashboard__TimeZone: "Europe/Moscow"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080" # Swagger: http://localhost:8080/swagger

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80" # Дашборд: http://localhost:3000

volumes:
  pgdata:
